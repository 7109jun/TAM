name: build

# 저장소 구조: tam-1.0.0/tam-1.0.0/ 안에 소스(Cargo.toml, src, std, examples ...)가 있다.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SRC: tam-1.0.0/tam-1.0.0

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: tam-1.0.0/tam-1.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.SRC }}

      - name: Build tamc.exe
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Locate LLVM (clang, lld-link)
        run: |
          # 러너에 LLVM이 이미 있을 수 있다. 공식 Windows 배포본에는 llc.exe가 없으므로
          # tamc는 llc가 없으면 clang -c로 .ll을 오브젝트로 만든다.
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang.exe")) {
            choco install llvm -y --no-progress
          }
          $bin = "C:\Program Files\LLVM\bin"
          Get-ChildItem $bin -Filter *.exe | Select-Object -First 80 Name
          foreach ($t in "clang.exe", "lld-link.exe") {
            if (-not (Test-Path "$bin\$t")) { throw "$t not found in $bin" }
          }
          & "$bin\clang.exe" --version

      - name: Package (tamc.exe + clang.exe + lld-link.exe + docs)
        run: |
          $bin = "C:\Program Files\LLVM\bin"
          New-Item -ItemType Directory -Force dist\tamc | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\tamc.exe dist\tamc\
          Copy-Item "$bin\clang.exe" dist\tamc\
          Copy-Item "$bin\lld-link.exe" dist\tamc\
          if (Test-Path "$bin\llc.exe") { Copy-Item "$bin\llc.exe" dist\tamc\ }
          Copy-Item -Recurse examples dist\tamc\examples
          # 문서는 소스 폴더에 있거나(tam-1.0.0/tam-1.0.0/docs) 저장소 루트(docs)에 있다.
          if (Test-Path docs) { Copy-Item -Recurse docs dist\tamc\docs }
          elseif (Test-Path "$env:GITHUB_WORKSPACE\docs") { Copy-Item -Recurse "$env:GITHUB_WORKSPACE\docs" dist\tamc\docs }
          Copy-Item README.md dist\tamc\
          Get-ChildItem dist\tamc

      - name: Smoke test with the packaged compiler only (no LLVM on PATH)
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Push-Location dist\tamc
          .\tamc.exe --version
          .\tamc.exe build examples\win_hello_exit.tam --target windows -o hello.exe
          if ($LASTEXITCODE -ne 0) { throw "tamc build failed" }
          .\hello.exe
          Write-Host "exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 42) { throw "expected exit code 42" }
          .\tamc.exe build examples\hello_os.tam --target windows -o hello_os.exe
          if ($LASTEXITCODE -ne 0) { throw "tamc build (hello_os) failed" }
          .\hello_os.exe
          Pop-Location

      - name: Zip
        run: Compress-Archive -Path dist\tamc -DestinationPath tamc-1.0.0-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tamc-1.0.0-windows-x64
          path: ${{ env.SRC }}/tamc-1.0.0-windows-x64.zip
          if-no-files-found: error
